<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слоговые домики</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #d9f0ff;
  color: #294650;
}

button { font: inherit; cursor: pointer; }

#viewport {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#frame { position: relative; }

#game {
  position: absolute;
  width: 1600px;
  height: 900px;
  transform-origin: top left;
  overflow: hidden;
  background: #bde4a3 url("assets/background.png")
    center / 100% 100% no-repeat;
}

.top {
  position: absolute;
  top: 18px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.title {
  margin: 0;
  padding: 10px 25px;
  border-radius: 22px;
  background: #ffffffdf;
  font-size: 36px;
}

.tools {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tools button, .level {
  border: 0;
  border-radius: 18px;
  padding: 12px 20px;
  background: #ffffffed;
  font-size: 23px;
}

#instruction {
  position: absolute;
  top: 97px;
  left: 240px;
  right: 240px;
  text-align: center;
  padding: 12px;
  font-size: 27px;
  border-radius: 20px;
  background: #ffffffdf;
}

#houses {
  position: absolute;
  top: 178px;
  left: 65px;
  right: 65px;
  height: 440px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
}

.house {
  position: relative;
  width: 100%;
  height: 100%;
}

.house-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  pointer-events: none;
  user-select: none;
}

.dots {
  position: absolute;
  top: 18%;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 9px;
  pointer-events: none;
}

.dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #3f4b61;
  border: 2px solid #ffffffcf;
  box-shadow: 0 2px 3px #0002;
}

.slot {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}

.card {
  width: 100%;
  height: 100%;
  padding: 2px;
  border: 3px solid transparent;
  border-radius: 12px;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.visual {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.visual img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.picture {
  font-size: 67px;
  line-height: 1.1;
  pointer-events: none;
}

.name {
  display: none;
  flex-shrink: 0;
  font-size: 16px;
  line-height: 1.1;
  padding-top: 2px;
  pointer-events: none;
}

.show-names .name { display: block; }
.show-names .picture { font-size: 54px; }

.selected {
  border-color: #ed9b19;
  background: #fff3bd88;
}

.house.over::after {
  content: "";
  position: absolute;
  inset: 27% 8% 2%;
  border: 5px solid #ffce54;
  border-radius: 18px;
  pointer-events: none;
}

#meadow {
  position: absolute;
  top: 645px;
  left: 270px;
  width: 1060px;
  height: 153px;
  border: 3px dashed #b88e5266;
  border-radius: 30px;
  background: #fff5dc19;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
}

#meadow.over {
  outline: 5px solid #ffce54;
  outline-offset: 3px;
}

.meadow-slot { width: 155px; height: 132px; }

.meadow-slot .card {
  background: #ffffff80;
  border-radius: 22px;
}

.meadow-slot .picture { font-size: 80px; }

#feedback {
  position: absolute;
  bottom: 23px;
  left: 190px;
  right: 190px;
  min-height: 45px;
  margin: 0;
  padding: 9px 20px;
  text-align: center;
  font-size: 25px;
  border-radius: 20px;
  background: #ffffffdb;
}

.ghost {
  position: fixed;
  z-index: 1000;
  width: 105px;
  height: 105px;
  pointer-events: none;
  transform: translate(-50%, -50%);
  background: #ffffffe6;
  border-radius: 20px;
  opacity: .95;
}

.ghost .picture { font-size: 65px; }
.ghost .name { display: none; }

#win {
  border: 0;
  border-radius: 28px;
  padding: 35px;
  text-align: center;
  color: #294650;
  max-width: 90vw;
}

#win::backdrop { background: #21434e66; }
#win h2 { font-size: 30px; }

#next {
  border: 0;
  padding: 15px 25px;
  border-radius: 17px;
  background: #9bd57b;
  font-size: 23px;
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2000;
  overflow: hidden;
}

.confetti {
  position: absolute;
  top: -25px;
  width: 12px;
  height: 18px;
  animation: fall 2.5s ease-in forwards;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>

<body>
<div id="viewport">
  <div id="frame">
    <main id="game">
      <div class="top">
        <h1 class="title">Слоговые домики</h1>
        <div class="tools">
          <span id="level" class="level"></span>
          <button id="names" type="button">Подписи</button>
          <button id="restart" type="button">Заново</button>
        </div>
      </div>

      <div id="instruction" aria-live="polite"></div>

      <section id="houses" aria-label="Четыре домика"></section>

      <section id="meadow"
        data-target="meadow"
        aria-label="Дорожка для лишних жителей"></section>

      <p id="feedback" aria-live="polite"></p>
    </main>
  </div>
</div>

<dialog id="win">
  <div style="font-size:65px">🎉🏡🎉</div>
  <h2 id="win-title"></h2>
  <p id="win-text"></p>
  <button id="next" type="button"></button>
</dialog>

<div id="confetti"></div>

<script>
"use strict";

const $ = selector => document.querySelector(selector);

/* Все 24 картинки загружены. */
const UPLOADED_PICTURES = 24;

const groups = [
  [
    ["кот", "🐱"],
    ["слон", "🐘"],
    ["тигр", "🐯"],
    ["жук", "🪲"],
    ["мяч", "⚽"],
    ["дом", "🏠"]
  ],
  [
    ["лиса", "🦊"],
    ["сова", "🦉"],
    ["коза", "🐐"],
    ["рыба", "🐟"],
    ["утка", "🦆"],
    ["белка", "🐿️"]
  ],
  [
    ["собака", "🐶"],
    ["корова", "🐄"],
    ["ворона", "🐦‍⬛"],
    ["курица", "🐔"],
    ["машина", "🚗"],
    ["ракета", "🚀"]
  ],
  [
    ["черепаха", "🐢"],
    ["гусеница", "🐛"],
    ["поросёнок", "🐷"],
    ["обезьяна", "🐒"],
    ["кукуруза", "🌽"],
    ["велосипед", "🚲"]
  ]
];

const words = groups.map((group, g) =>
  group.map((item, i) => {
    const number = g * 6 + i + 1;
    const id = "pik-" + String(number).padStart(2, "0");

    return {
      id,
      number,
      name: item[0],
      emoji: item[1],
      syllables: g + 1,
      img: `assets/pictures/${id}.png`
    };
  })
);

const pictureCache = new Map();

words.flat().forEach(word => {
  if (word.number <= UPLOADED_PICTURES) {
    const image = new Image();
    image.src = word.img;
    pictureCache.set(word.id, image);
  }
});

/*
  Окна: [слева %, сверху %, ширина %, высота %].
*/
const houseSettings = [
  {
    img: "assets/houses/house-01.png",
    windows: [
      [16.5, 31.5, 29, 21],
      [54.5, 31.5, 29, 21],
      [16.5, 59.5, 29, 21],
      [54.5, 59.5, 29, 21]
    ]
  },
  {
    img: "assets/houses/house-02.png",
    windows: [
      [18.5, 30.5, 27, 21.5],
      [54, 30.5, 27, 21.5],
      [18.5, 58.5, 27, 21.5],
      [54, 58.5, 27, 21.5]
    ]
  },
  {
    img: "assets/houses/house-03.png",
    windows: [
      [19, 30, 26.5, 19.5],
      [54, 30, 26.5, 19.5],
      [19, 56.5, 26.5, 19.5],
      [54, 56.5, 26.5, 19.5]
    ]
  },
  {
    img: "assets/houses/house-04.png",
    windows: [
      [19, 31.5, 26.5, 21],
      [54, 31.5, 26.5, 21],
      [19, 60, 26.5, 21],
      [54, 60, 26.5, 21]
    ]
  }
];

const shifts = [1, 2, 3, 1, 3];

let level = 0;
let phase = 1;
let residents = [];
let selected = null;
let drag = null;
let suppressClick = false;
let audioContext = null;
let confettiTimer = null;

function fitGame() {
  const scale = Math.min(
    window.innerWidth / 1600,
    window.innerHeight / 900
  );

  $("#frame").style.width = `${1600 * scale}px`;
  $("#frame").style.height = `${900 * scale}px`;
  $("#game").style.transform = `scale(${scale})`;
}

window.addEventListener("resize", fitGame);
fitGame();

function feedback(text) {
  $("#feedback").textContent = text;
}

function sound(success) {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    audioContext ||= new AudioContextClass();
    audioContext.resume().catch(() => {});

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    oscillator.frequency.value = success ? 700 : 230;
    gain.gain.setValueAtTime(0.055, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.2);
  } catch (_) {}
}

function createCard(resident) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card";
  card.dataset.id = resident.id;
  card.setAttribute("aria-label", resident.name);

  if (selected === resident.id) {
    card.classList.add("selected");
  }

  const visual = document.createElement("span");
  visual.className = "visual";

  const picture = document.createElement("span");
  picture.className = "picture";
  picture.textContent = resident.emoji;

  if (resident.number <= UPLOADED_PICTURES) {
    const image = document.createElement("img");
    image.alt = "";
    image.draggable = false;
    image.onerror = () => visual.replaceChildren(picture);
    image.src = resident.img;
    visual.append(image);
  } else {
    visual.append(picture);
  }

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = resident.name;

  card.append(visual, name);
  return card;
}

function render() {
  const houses = $("#houses");
  houses.replaceChildren();

  houseSettings.forEach((settings, index) => {
    const number = index + 1;
    const house = document.createElement("section");
    house.className = "house";
    house.dataset.target = String(number);
    house.setAttribute(
      "aria-label",
      `Домик: количество слогов — ${number}`
    );

    const image = document.createElement("img");
    image.className = "house-image";
    image.src = settings.img;
    image.alt = "";
    image.draggable = false;

    const dots = document.createElement("div");
    dots.className = "dots";

    for (let i = 0; i < number; i++) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dots.append(dot);
    }

    house.append(image, dots);

    settings.windows.forEach((position, slotNumber) => {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.left = position[0] + "%";
      slot.style.top = position[1] + "%";
      slot.style.width = position[2] + "%";
      slot.style.height = position[3] + "%";

      const resident = residents.find(item =>
        item.location === number && item.slot === slotNumber
      );

      if (resident) slot.append(createCard(resident));
      house.append(slot);
    });

    houses.append(house);
  });

  const meadow = $("#meadow");
  meadow.replaceChildren();

  const outside = residents.filter(item =>
    item.location === "meadow"
  );

  for (let i = 0; i < 4; i++) {
    const slot = document.createElement("div");
    slot.className = "meadow-slot";

    if (outside[i]) slot.append(createCard(outside[i]));
    meadow.append(slot);
  }

  $("#level").textContent = `Уровень ${level + 1} / 5`;

  $("#instruction").textContent = phase === 1
    ? "Найди лишних жителей и перенеси их на дорожку."
    : "Рассели жителей с дорожки по нужным домикам.";
}

function loadLevel() {
  phase = 1;
  selected = null;
  residents = [];

  for (let g = 0; g < 4; g++) {
    for (let i = 0; i < 3; i++) {
      const word = words[g][(level + i) % 6];

      residents.push({
        ...word,
        start: g + 1,
        location: g + 1,
        slot: i
      });
    }
  }

  for (let destination = 0; destination < 4; destination++) {
    const sourceGroup = (destination + shifts[level]) % 4;
    const word = words[sourceGroup][(level + 3) % 6];

    residents.push({
      ...word,
      start: destination + 1,
      location: destination + 1,
      slot: 3
    });
  }

  for (let house = 1; house <= 4; house++) {
    const slots = [0, 1, 2, 3];

    for (let i = slots.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [slots[i], slots[j]] = [slots[j], slots[i]];
    }

    residents
      .filter(item => item.location === house)
      .forEach((item, i) => item.slot = slots[i]);
  }

  feedback("Перетаскивай жителей мышкой или пальцем.");
  render();
}

function move(id, target) {
  const resident = residents.find(item => item.id === id);

  if (!resident || resident.location === target) return;

  if (phase === 1) {
    if (target !== "meadow") {
      feedback("Сначала найди всех лишних жителей.");
      sound(false);
      return;
    }

    if (resident.start === resident.syllables) {
      feedback("Этот житель уже в своём домике.");
      sound(false);
      return;
    }

    resident.location = "meadow";
    selected = null;
    sound(true);

    const found = residents.filter(item =>
      item.location === "meadow"
    ).length;

    feedback(`Верно! Найдено: ${found} из 4.`);

    if (found === 4) {
      phase = 2;
      feedback("Все найдены! Теперь рассели жителей.");
    }
  } else {
    if (resident.location !== "meadow") {
      feedback("Выбери жителя на дорожке.");
      return;
    }

    if (target !== resident.syllables) {
      feedback("Посчитай слоги и попробуй другой домик.");
      sound(false);
      return;
    }

    const occupied = residents
      .filter(item => item.location === target)
      .map(item => item.slot);

    const freeSlot = [0, 1, 2, 3].find(slot =>
      !occupied.includes(slot)
    );

    if (freeSlot === undefined) return;

    resident.location = target;
    resident.slot = freeSlot;
    selected = null;

    sound(true);
    feedback("Верно! Житель вернулся домой.");
  }

  render();

  if (residents.every(item => item.location === item.syllables)) {
    celebrate();
  }
}

function clearConfetti() {
  clearTimeout(confettiTimer);
  $("#confetti").replaceChildren();
}

function celebrate() {
  const finalLevel = level === 4;

  $("#win-title").textContent = finalLevel
    ? "Все пять уровней пройдены!"
    : "Все жители дома!";

  $("#win-text").textContent = finalLevel
    ? "Молодец! Ты помог всем жителям."
    : "Молодец! Перейдём к следующему уровню.";

  $("#next").textContent = finalLevel
    ? "Играть сначала"
    : "Следующий уровень";

  $("#win").showModal();
  clearConfetti();

  const colors = ["#ffad50", "#7bc8ed", "#c596ed", "#ffdb55"];

  for (let i = 0; i < 75; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = Math.random() * 0.5 + "s";
    $("#confetti").append(piece);
  }

  confettiTimer = setTimeout(clearConfetti, 3200);
}

function clearHover() {
  document.querySelectorAll(".over").forEach(element =>
    element.classList.remove("over")
  );
}

function targetAt(x, y) {
  return document.elementFromPoint(x, y)
    ?.closest("[data-target]");
}

function cancelDrag() {
  if (drag?.ghost) drag.ghost.remove();
  drag = null;
  clearHover();
}

function readTarget(element) {
  return element.dataset.target === "meadow"
    ? "meadow"
    : Number(element.dataset.target);
}

document.addEventListener("pointerdown", event => {
  const card = event.target.closest(".card[data-id]");

  if (!card || event.button !== 0 || drag || $("#win").open) return;

  drag = {
    id: card.dataset.id,
    pointerId: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    moved: false,
    ghost: null,
    card
  };

  card.setPointerCapture(event.pointerId);
});

document.addEventListener("pointermove", event => {
  if (!drag || drag.pointerId !== event.pointerId) return;

  if (!drag.moved) {
    const distance = Math.hypot(
      event.clientX - drag.x,
      event.clientY - drag.y
    );

    if (distance < 8) return;

    drag.moved = true;
    drag.ghost = drag.card.cloneNode(true);
    drag.ghost.classList.add("ghost");
    drag.ghost.removeAttribute("data-id");
    document.body.append(drag.ghost);
  }

  drag.ghost.style.left = event.clientX + "px";
  drag.ghost.style.top = event.clientY + "px";

  clearHover();
  targetAt(event.clientX, event.clientY)?.classList.add("over");
});

document.addEventListener("pointerup", event => {
  if (!drag || drag.pointerId !== event.pointerId) return;

  const current = drag;
  drag = null;
  clearHover();

  if (current.moved) {
    current.ghost.remove();

    suppressClick = true;
    setTimeout(() => suppressClick = false, 0);

    const target = targetAt(event.clientX, event.clientY);
    if (target) move(current.id, readTarget(target));

    event.preventDefault();
  }
});

document.addEventListener("pointercancel", event => {
  if (drag?.pointerId === event.pointerId) cancelDrag();
});

window.addEventListener("blur", cancelDrag);

document.addEventListener("click", event => {
  if (suppressClick || $("#win").open) return;

  const card = event.target.closest(".card[data-id]");

  if (card) {
    selected = selected === card.dataset.id
      ? null
      : card.dataset.id;

    render();
    return;
  }

  const target = event.target.closest("[data-target]");

  if (target && selected) {
    move(selected, readTarget(target));
  }
});

$("#names").onclick = () => {
  const visible = $("#game").classList.toggle("show-names");
  $("#names").setAttribute("aria-pressed", String(visible));
};

$("#restart").onclick = () => {
  cancelDrag();
  if ($("#win").open) $("#win").close();
  clearConfetti();
  level = 0;
  loadLevel();
};

$("#next").onclick = () => {
  $("#win").close();
  clearConfetti();
  level = level === 4 ? 0 : level + 1;
  loadLevel();
};

$("#win").addEventListener("cancel", event =>
  event.preventDefault()
);

loadLevel();
</script>
</body>
</html>
