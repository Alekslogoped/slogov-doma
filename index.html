<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слоговые домики</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #d9f0ff;
  color: #294650;
}

button { font: inherit; cursor: pointer; }

#viewport {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#frame { position: relative; }

#game {
  position: absolute;
  width: 1600px;
  height: 900px;
  transform-origin: top left;
  overflow: hidden;
  background: #bde4a3 url("assets/background.png") center / 100% 100% no-repeat;
}

/* Верхняя панель */
.top {
  position: absolute;
  top: 18px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.title {
  margin: 0;
  padding: 10px 25px;
  border-radius: 22px;
  background: #ffffffdf;
  font-size: 36px;
}

.tools {
  display: flex;
  align-items: center;
  gap: 12px;
}

.tools button, .level {
  border: 0;
  border-radius: 18px;
  padding: 12px 20px;
  background: #ffffffed;
  font-size: 23px;
}

#instruction {
  position: absolute;
  top: 97px;
  left: 240px;
  right: 240px;
  text-align: center;
  padding: 12px;
  font-size: 27px;
  border-radius: 20px;
  background: #ffffffdf;
}

/* Четыре домика */
#houses {
  position: absolute;
  top: 205px;
  left: 65px;
  right: 65px;
  height: 385px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 35px;
}

.house {
  position: relative;
  margin-top: 55px;
  height: 330px;
  padding: 52px 18px 18px;
  border: 6px solid #fff6;
  border-radius: 13px 13px 20px 20px;
  background: var(--wall);
  box-shadow: 0 8px 0 #47673933;
}

.roof {
  position: absolute;
  top: -65px;
  left: -20px;
  right: -20px;
  height: 80px;
  background: var(--roof);
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.dots {
  position: absolute;
  top: 18px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.dot {
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #354853;
}

.windows {
  display: grid;
  height: 100%;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 15px;
}

.slot {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  border: 5px solid white;
  border-radius: 17px;
  background: #fffdf0;
  box-shadow: inset 0 2px 8px #0000000c;
}

.card {
  width: 100%;
  height: 100%;
  border: 3px solid transparent;
  border-radius: 12px;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.picture {
  font-size: 75px;
  line-height: 1.1;
  pointer-events: none;
}

.card img {
  width: 95%;
  height: 90%;
  object-fit: contain;
  pointer-events: none;
}

.name {
  display: none;
  font-size: 18px;
  pointer-events: none;
}

.show-names .name { display: block; }
.show-names .picture { font-size: 65px; }

.selected {
  border-color: #ed9b19;
  background: #fff3bd;
}

.over {
  outline: 6px solid #ffce54;
  outline-offset: 4px;
}

/* Зона жителей на дорожке */
#meadow {
  position: absolute;
  top: 645px;
  left: 270px;
  width: 1060px;
  height: 153px;
  border: 3px dashed #b88e5266;
  border-radius: 30px;
  background: #fff5dc19;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
}

.meadow-slot {
  width: 155px;
  height: 132px;
  border-radius: 22px;
}

.meadow-slot .card {
  background: #ffffffb5;
  border-radius: 22px;
}

#feedback {
  position: absolute;
  bottom: 23px;
  left: 190px;
  right: 190px;
  min-height: 45px;
  margin: 0;
  padding: 9px 20px;
  text-align: center;
  font-size: 25px;
  border-radius: 20px;
  background: #ffffffdb;
}

.ghost {
  position: fixed;
  z-index: 1000;
  width: 105px;
  height: 105px;
  pointer-events: none;
  transform: translate(-50%, -50%);
  background: #ffffffe6;
  border-radius: 20px;
  opacity: .95;
}

.ghost .picture { font-size: 65px; }
.ghost .name { display: none; }

/* Победа */
#win {
  border: 0;
  border-radius: 28px;
  padding: 35px;
  text-align: center;
  color: #294650;
  max-width: 90vw;
}

#win::backdrop { background: #21434e66; }

#win h2 { font-size: 30px; }

#next {
  border: 0;
  padding: 15px 25px;
  border-radius: 17px;
  background: #9bd57b;
  font-size: 23px;
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2000;
  overflow: hidden;
}

.confetti {
  position: absolute;
  top: -25px;
  width: 12px;
  height: 18px;
  animation: fall 2.5s ease-in forwards;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>

<body>
<div id="viewport">
  <div id="frame">
    <main id="game">
      <div class="top">
        <h1 class="title">Слоговые домики</h1>

        <div class="tools">
          <span class="level" id="level"></span>
          <button id="names">Подписи</button>
          <button id="restart">Заново</button>
        </div>
      </div>

      <div id="instruction" aria-live="polite"></div>
      <section id="houses"></section>
      <section id="meadow" data-target="meadow"
               aria-label="Дорожка для лишних жителей"></section>
      <p id="feedback" aria-live="polite"></p>
    </main>
  </div>
</div>

<dialog id="win">
  <div style="font-size:65px">🎉🏡🎉</div>
  <h2 id="win-title"></h2>
  <p id="win-text"></p>
  <button id="next"></button>
</dialog>

<div id="confetti"></div>

<script>
const $ = selector => document.querySelector(selector);

// Картинки позже загрузим в assets/pictures.
// Чтобы подключить их, измените USE_IMAGES на true.
const USE_IMAGES = false;

const groups = [
  [
    ["кот", "🐱"],
    ["слон", "🐘"],
    ["тигр", "🐯"],
    ["жук", "🪲"],
    ["мяч", "⚽"],
    ["дом", "🏠"]
  ],
  [
    ["лиса", "🦊"],
    ["сова", "🦉"],
    ["коза", "🐐"],
    ["рыба", "🐟"],
    ["утка", "🦆"],
    ["белка", "🐿️"]
  ],
  [
    ["собака", "🐶"],
    ["корова", "🐄"],
    ["ворона", "🐦‍⬛"],
    ["курица", "🐔"],
    ["машина", "🚗"],
    ["ракета", "🚀"]
  ],
  [
    ["черепаха", "🐢"],
    ["гусеница", "🐛"],
    ["поросёнок", "🐷"],
    ["обезьяна", "🐒"],
    ["кукуруза", "🌽"],
    ["велосипед", "🚲"]
  ]
];

const words = groups.map((group, g) =>
  group.map((item, i) => {
    const number = g * 6 + i + 1;

    return {
      id: "pik-" + String(number).padStart(2, "0"),
      name: item[0],
      emoji: item[1],
      syllables: g + 1,
      img: "assets/pictures/pik-" +
           String(number).padStart(2, "0") + ".png"
    };
  })
);

const colors = [
  ["#ffddb7", "#dd8c4e"],
  ["#c8e9ff", "#679cd4"],
  ["#ebd6ff", "#a27ac8"],
  ["#ffecb6", "#d5a643"]
];

// В каждом уровне — новые сочетания.
// Сдвиг определяет, из какого домика приходит лишний житель.
const shifts = [1, 2, 3, 1, 3];

let level = 0;
let phase = 1;
let residents = [];
let selected = null;
let drag = null;
let suppressClick = false;
let audioContext = null;

function fitGame() {
  const scale = Math.min(
    window.innerWidth / 1600,
    window.innerHeight / 900
  );

  $("#frame").style.width = 1600 * scale + "px";
  $("#frame").style.height = 900 * scale + "px";
  $("#game").style.transform = `scale(${scale})`;
}

window.addEventListener("resize", fitGame);
fitGame();

function feedback(text) {
  $("#feedback").textContent = text;
}

function sound(success) {
  try {
    audioContext ??= new (
      window.AudioContext || window.webkitAudioContext
    )();

    audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = success ? 700 : 230;
    gain.gain.setValueAtTime(.055, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001, audioContext.currentTime + .2
    );

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .2);
  } catch {}
}

function createCard(resident) {
  const button = document.createElement("button");

  button.type = "button";
  button.className = "card";
  button.dataset.id = resident.id;
  button.setAttribute("aria-label", resident.name);

  if (selected === resident.id) {
    button.classList.add("selected");
  }

  const picture = document.createElement("span");
  picture.className = "picture";
  picture.textContent = resident.emoji;

  if (USE_IMAGES) {
    const image = document.createElement("img");
    image.src = resident.img;
    image.alt = "";
    image.draggable = false;

    image.onerror = () => {
      image.replaceWith(picture);
    };

    button.append(image);
  } else {
    button.append(picture);
  }

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = resident.name;
  button.append(name);

  return button;
}

function render() {
  $("#houses").replaceChildren();

  for (let houseNumber = 1; houseNumber <= 4; houseNumber++) {
    const house = document.createElement("section");

    house.className = "house";
    house.dataset.target = houseNumber;
    house.style.setProperty("--wall", colors[houseNumber - 1][0]);
    house.style.setProperty("--roof", colors[houseNumber - 1][1]);

    house.innerHTML = `
      <div class="roof"></div>
      <div class="dots">
        ${'<span class="dot"></span>'.repeat(houseNumber)}
      </div>
      <div class="windows"></div>
    `;

    const windows = house.querySelector(".windows");

    for (let slotNumber = 0; slotNumber < 4; slotNumber++) {
      const slot = document.createElement("div");
      slot.className = "slot";

      const resident = residents.find(item =>
        item.location === houseNumber &&
        item.slot === slotNumber
      );

      if (resident) slot.append(createCard(resident));
      windows.append(slot);
    }

    $("#houses").append(house);
  }

  const meadow = $("#meadow");
  meadow.replaceChildren();

  const outside = residents.filter(
    item => item.location === "meadow"
  );

  for (let i = 0; i < 4; i++) {
    const slot = document.createElement("div");
    slot.className = "meadow-slot";

    if (outside[i]) slot.append(createCard(outside[i]));
    meadow.append(slot);
  }

  $("#level").textContent = `Уровень ${level + 1} / 5`;

  $("#instruction").textContent = phase === 1
    ? "Найди лишних жителей и перенеси их на дорожку."
    : "Рассели жителей с дорожки по нужным домикам.";
}

function loadLevel() {
  phase = 1;
  selected = null;
  residents = [];

  // Три правильных жителя в каждом доме.
  for (let g = 0; g < 4; g++) {
    for (let i = 0; i < 3; i++) {
      const word = words[g][(level + i) % 6];

      residents.push({
        ...word,
        start: g + 1,
        location: g + 1,
        slot: i
      });
    }
  }

  // По одному лишнему жителю в каждом доме.
  // Каждый из четырёх домов получит одного нового жителя.
  for (let destination = 0; destination < 4; destination++) {
    const sourceGroup = (destination + shifts[level]) % 4;
    const word = words[sourceGroup][(level + 3) % 6];

    residents.push({
      ...word,
      start: destination + 1,
      location: destination + 1,
      slot: 3
    });
  }

  // Меняем расположение жителей в окошках,
  // чтобы лишний не стоял постоянно в одном месте.
  for (let number = 1; number <= 4; number++) {
    const houseResidents = residents.filter(
      item => item.location === number
    );

    const slots = [0, 1, 2, 3];

    for (let i = slots.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [slots[i], slots[j]] = [slots[j], slots[i]];
    }

    houseResidents.forEach((item, i) => item.slot = slots[i]);
  }

  feedback("Перетаскивай жителей мышкой или пальцем.");
  render();
}

function move(id, target) {
  const resident = residents.find(item => item.id === id);
  if (!resident || resident.location === target) return;

  if (phase === 1) {
    if (target !== "meadow") {
      feedback("Сначала найди всех лишних жителей.");
      sound(false);
      return;
    }

    if (resident.start === resident.syllables) {
      feedback("Этот житель уже в своём домике.");
      sound(false);
      return;
    }

    resident.location = "meadow";
    selected = null;

    sound(true);

    const found = residents.filter(
      item => item.location === "meadow"
    ).length;

    feedback(`Верно! Найдено: ${found} из 4.`);

    if (found === 4) {
      phase = 2;
      feedback("Все найдены! Теперь рассели жителей.");
    }
  } else {
    if (resident.location !== "meadow") {
      feedback("Выбери жителя на дорожке.");
      return;
    }

    if (target !== resident.syllables) {
      feedback("Посчитай слоги и попробуй другой домик.");
      sound(false);
      return;
    }

    const occupied = residents
      .filter(item => item.location === target)
      .map(item => item.slot);

    const freeSlot = [0, 1, 2, 3].find(
      slot => !occupied.includes(slot)
    );

    if (freeSlot === undefined) return;

    resident.location = target;
    resident.slot = freeSlot;
    selected = null;

    sound(true);
    feedback("Верно! Житель вернулся домой.");
  }

  render();

  if (residents.every(
    item => item.location === item.syllables
  )) {
    celebrate();
  }
}

function celebrate() {
  const finalLevel = level === 4;

  $("#win-title").textContent = finalLevel
    ? "Все пять уровней пройдены!"
    : "Все жители дома!";

  $("#win-text").textContent = finalLevel
    ? "Молодец! Ты помог всем жителям."
    : "Молодец! Перейдём к следующему уровню.";

  $("#next").textContent = finalLevel
    ? "Играть сначала"
    : "Следующий уровень";

  $("#win").showModal();

  const host = $("#confetti");
  host.replaceChildren();

  const palette = ["#ffad50", "#7bc8ed", "#c596ed", "#ffdb55"];

  for (let i = 0; i < 75; i++) {
    const piece = document.createElement("i");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = palette[i % palette.length];
    piece.style.animationDelay = Math.random() * .5 + "s";
    host.append(piece);
  }

  setTimeout(() => host.replaceChildren(), 3200);
}

function clearHover() {
  document.querySelectorAll(".over").forEach(
    element => element.classList.remove("over")
  );
}

function targetAt(x, y) {
  return document.elementFromPoint(x, y)
    ?.closest("[data-target]");
}

document.addEventListener("pointerdown", event => {
  const card = event.target.closest(".card");

  if (!card || event.button !== 0) return;

  drag = {
    id: card.dataset.id,
    x: event.clientX,
    y: event.clientY,
    moved: false,
    ghost: null
  };

  card.setPointerCapture(event.pointerId);
});

document.addEventListener("pointermove", event => {
  if (!drag) return;

  const distance = Math.hypot(
    event.clientX - drag.x,
    event.clientY - drag.y
  );

  if (!drag.moved && distance > 8) {
    drag.moved = true;

    drag.ghost = document.querySelector(
      `[data-id="${drag.id}"]`
    ).cloneNode(true);

    drag.ghost.classList.add("ghost");
    document.body.append(drag.ghost);
  }

  if (drag.moved) {
    drag.ghost.style.left = event.clientX + "px";
    drag.ghost.style.top = event.clientY + "px";

    clearHover();
    targetAt(event.clientX, event.clientY)
      ?.classList.add("over");
  }
});

document.addEventListener("pointerup", event => {
  if (!drag) return;

  const current = drag;
  drag = null;
  clearHover();

  if (current.moved) {
    current.ghost.remove();

    const element = targetAt(event.clientX, event.clientY);

    if (element) {
      const target = element.dataset.target === "meadow"
        ? "meadow"
        : Number(element.dataset.target);

      move(current.id, target);
    }

    event.preventDefault();
    suppressClick = true;

    setTimeout(() => suppressClick = false, 0);
  }
});

document.addEventListener("pointercancel", () => {
  drag?.ghost?.remove();
  drag = null;
  clearHover();
});

// Можно также нажать на жителя, затем на дорожку или домик.
document.addEventListener("click", event => {
  if (suppressClick) return;

  const card = event.target.closest(".card");

  if (card) {
    selected = card.dataset.id;
    render();
    return;
  }

  const element = event.target.closest("[data-target]");

  if (element && selected) {
    move(
      selected,
      element.dataset.target === "meadow"
        ? "meadow"
        : Number(element.dataset.target)
    );
  }
});

$("#names").onclick = () => {
  $("#game").classList.toggle("show-names");
};

$("#restart").onclick = () => {
  $("#win").close();
  $("#confetti").replaceChildren();
  level = 0;
  loadLevel();
};

$("#next").onclick = () => {
  $("#win").close();
  $("#confetti").replaceChildren();
  level = level === 4 ? 0 : level + 1;
  loadLevel();
};

loadLevel();
</script>
</body>
</html>
